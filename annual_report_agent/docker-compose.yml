services:
  backend:
    build: ./backend
    env_file:
      - path: ../.env          # repository .env (fallback)
        required: false
      - path: .env             # this folder's .env (LLM_BASE_URL / LLM_MODEL / LLM_API_KEY)
        required: false
    environment:
      DATA_DIR: /data
      PORT: "8023"
    volumes:
      - agent_data:/data
    ports:
      - "${BACKEND_PORT:-8024}:8023"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8023/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  agent_data:
